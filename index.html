<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="pageTitle">welcome to bebselris ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Firebase SDK (bebselris_pure_pink แยกขาด 100%) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      /* โทนสีตามภาพ Color Palette ที่ส่งมาเป๊ะๆ */
      --palette-bg-top: #fff0f5;
      --palette-bg-mid: #fce7f0;
      --palette-bg-bot: #fadbe7;
      --palette-card: rgba(255, 255, 255, 0.96);
      --palette-soft: #f5d3e4;
      --palette-main: #f2a7be;
      --palette-deep: #db7b97;
      --palette-border: #f7d6e2;
      --palette-text: #4e3d43;
      --palette-muted: #947e85;
      --palette-glow: rgba(242, 167, 190, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', 'Mitr', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at top, #ffffff 0%, var(--palette-bg-top) 45%, var(--palette-bg-mid) 80%, var(--palette-bg-bot) 100%);
      color: var(--palette-text);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* เลเยอร์ลูกเล่นลอย: ♡ 🍮 🪽 ☁️ และรูปภาพ PNG */
    .floating-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .float-item {
      position: absolute;
      bottom: -70px;
      animation: floatUpAnim 12s linear infinite;
      opacity: 0.75;
      pointer-events: none;
    }

    .float-emoji {
      font-size: 22px;
      filter: drop-shadow(0 2px 6px var(--palette-glow));
    }

    .float-png {
      width: 42px;
      height: 42px;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px var(--palette-glow));
    }

    @keyframes floatUpAnim {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      15% { opacity: 0.85; }
      85% { opacity: 0.85; }
      100% { transform: translateY(-115vh) rotate(360deg); opacity: 0; }
    }

    .container {
      max-width: 440px;
      margin: 0 auto;
      padding: 16px 14px 80px;
      position: relative;
      z-index: 2;
    }

    /* Profile Box */
    .profile-card {
      background: var(--palette-card);
      backdrop-filter: blur(14px);
      border-radius: 30px;
      padding: 12px 14px 22px;
      box-shadow: 0 10px 28px var(--palette-glow);
      border: 2px solid #ffffff;
      text-align: center;
      margin-bottom: 14px;
    }

    .banner-container {
      width: 100%;
      height: 145px;
      border-radius: 22px;
      overflow: hidden;
      background: var(--palette-bg-mid);
      border: 1px solid #ffffff;
    }

    .banner-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-wrap {
      position: relative;
      margin-top: -50px;
      display: inline-block;
      width: 96px;
      height: 96px;
    }

    .profile-img {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      object-fit: cover;
      border: 3.5px solid #ffffff;
      box-shadow: 0 6px 18px var(--palette-glow);
      background: #ffffff;
      position: absolute;
      bottom: 0;
      left: 6px;
    }

    .discord-frame {
      position: absolute;
      inset: -4px;
      width: 104px;
      height: 104px;
      object-fit: contain;
      z-index: 2;
      pointer-events: none;
    }

    .store-name {
      font-size: 19px;
      font-weight: 700;
      color: var(--palette-text);
      margin-top: 8px;
      letter-spacing: 0.3px;
    }

    .bio-text {
      font-size: 13px;
      line-height: 1.65;
      color: var(--palette-muted);
      white-space: pre-line;
      margin-top: 6px;
      padding: 0 10px;
    }

    .music-bar {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      padding: 5px 16px;
      border-radius: 20px;
      background: #ffffff;
      border: 1.5px solid var(--palette-border);
      color: var(--palette-deep);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px var(--palette-glow);
    }

    /* 4 ไฮไลท์สตอรี่ */
    .highlights-scroll {
      display: flex;
      gap: 14px;
      padding: 8px 4px 14px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .highlights-scroll::-webkit-scrollbar { display: none; }
    
    .highlight-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .highlight-ring {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      padding: 2.5px;
      background: linear-gradient(135deg, var(--palette-soft), var(--palette-main));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px var(--palette-glow);
    }
    .highlight-thumb {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #ffffff;
      background: #fff;
    }
    .highlight-name {
      font-size: 11px;
      color: var(--palette-text);
      max-width: 68px;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
      font-weight: 600;
    }

    /* 4 แท็บเมนู: Home Review Details Contact */
    .tabs-header {
      display: flex;
      border-top: 1.5px solid var(--palette-border);
      border-bottom: 1.5px solid var(--palette-border);
      background: rgba(255, 255, 255, 0.9);
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .tab-btn {
      flex: 1;
      padding: 12px 0;
      background: none;
      border: none;
      color: var(--palette-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      border-bottom: 2.5px solid transparent;
      transition: all 0.2s;
    }
    .tab-btn.active {
      color: var(--palette-deep);
      border-bottom: 2.5px solid var(--palette-deep);
      font-weight: 700;
      background: #fff9fb;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* แท็บ 1: Home (ตารางโพสต์ 3 ช่องแบบ IG) */
    .section-card {
      background: var(--palette-card);
      backdrop-filter: blur(14px);
      border-radius: 26px;
      padding: 16px 14px;
      box-shadow: 0 8px 24px var(--palette-glow);
      border: 2px solid #ffffff;
    }

    .posts-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .post-slot {
      aspect-ratio: 1;
      border-radius: 14px;
      overflow: hidden;
      border: 1.5px solid #ffffff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
      background: var(--palette-bg-mid);
      cursor: pointer;
    }

    .post-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.2s ease;
      display: block;
    }
    .post-slot:active img { transform: scale(0.96); }

    /* แท็บ 2: Review (รวมไฮไลท์รีวิวแบบ Infinity) */
    .review-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .review-card-item {
      background: var(--palette-card);
      border: 1.5px solid var(--palette-border);
      border-radius: 20px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      box-shadow: 0 6px 18px var(--palette-glow);
    }
    .review-card-item img {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--palette-soft);
    }
    .review-info { flex: 1; }
    .review-info-title { font-size: 14px; font-weight: 700; color: var(--palette-text); }
    .review-info-sub { font-size: 12px; color: var(--palette-muted); margin-top: 2px; }

    /* แท็บ 3: Details (มีรายละเอียด & คำขอบคุณ) */
    .details-box {
      background: var(--palette-card);
      border: 2px solid #ffffff;
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 8px 24px var(--palette-glow);
    }
    .details-text {
      font-size: 13.5px;
      line-height: 1.7;
      color: var(--palette-muted);
      white-space: pre-line;
    }
    .thanks-card {
      margin-top: 14px;
      padding: 14px;
      border-radius: 18px;
      background: #fff8fa;
      border: 1.5px dashed var(--palette-main);
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--palette-deep);
    }

    /* แท็บ 4: Contact (3 ช่องทาง) */
    .contact-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .contact-link-item {
      background: var(--palette-card);
      border: 1.5px solid var(--palette-border);
      border-radius: 20px;
      padding: 15px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: var(--palette-text);
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 6px 18px var(--palette-glow);
      transition: transform 0.2s;
    }
    .contact-link-item:active { transform: scale(0.97); }

    /* Modal Popup ดูงาน: แสดงรูปตามขนาดจริง 100% ไม่บีบรูป */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(25, 25, 28, 0.65);
      backdrop-filter: blur(8px);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.active { display: flex; }
    .modal-card {
      width: 100%;
      max-width: 440px;
      max-height: 90vh;
      overflow-y: auto;
      background: #ffffff;
      border-radius: 24px;
      padding: 16px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      background: var(--palette-bg-mid);
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      color: var(--palette-deep);
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .modal-img-wrap {
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      background: #fff5f7;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-img-wrap img {
      width: 100%;
      height: auto;
      max-height: 65vh;
      object-fit: contain;
      display: block;
      border-radius: 16px;
    }
    .modal-desc {
      font-size: 13.5px;
      line-height: 1.6;
      color: var(--palette-muted);
      white-space: pre-line;
      margin-bottom: 14px;
    }
    .modal-link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 11px;
      border-radius: 16px;
      background: var(--palette-main);
      color: #ffffff;
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 600;
    }

    /* Story Fullscreen Viewer */
    .story-modal {
      position: fixed;
      inset: 0;
      background: #000000;
      z-index: 9999999;
      display: none;
      flex-direction: column;
      justify-content: space-between;
    }
    .story-modal.show { display: flex; }
    .story-bars {
      display: flex;
      gap: 4px;
      padding: 12px 14px 6px;
      z-index: 10;
    }
    .story-bar {
      flex: 1;
      height: 3px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px;
      overflow: hidden;
    }
    .story-bar-fill {
      width: 0%;
      height: 100%;
      background: #ffffff;
      transition: width 0.1s linear;
    }
    .story-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 14px;
      z-index: 10;
    }
    .story-user {
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
    }
    .story-close {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 24px;
      cursor: pointer;
    }
    .story-body {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .story-body img {
      max-width: 100%;
      max-height: 80vh;
      object-fit: contain;
    }
    .story-nav-btn {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 45%;
      z-index: 5;
    }
    .story-nav-left { left: 0; }
    .story-nav-right { right: 0; }
  </style>
</head>
<body>

  <!-- เพลงเล่นทันทีเมื่อเข้าเว็บ (ไม่มีหน้าต่างกดเข้าสู่ระบบใดๆ ทั้งสิ้น) -->
  <audio id="bgMusic" loop autoplay playsinline preload="auto" src="https://file.garden/asG8Gt-rqWIpi3II/YENTED%20-%20%E0%B8%AB%E0%B8%B4%E0%B8%99%E0%B8%AB%E0%B8%A2%E0%B8%94%E0%B8%A5%E0%B8%87%E0%B8%99%E0%B9%89%E0%B8%B3%20(adore)%20ft.%20Minchang%2C%20gomen.%20%5BOfficial%20Video%5D.mp3"></audio>

  <!-- เลเยอร์ลูกเล่นลอยไปมา: เฉพาะ ♡ 🍮 🪽 ☁️ และรูป PNG ตามที่สั่ง -->
  <div class="floating-container" id="floatingContainer"></div>

  <div class="container">

    <!-- Profile Box -->
    <div class="profile-card">
      <div class="banner-container">
        <img id="mainBanner" class="banner-img" src="https://c.tenor.com/qvn5EduVCSDAAAAC/tenor.gif" alt="Banner">
      </div>

      <div class="profile-wrap">
        <img id="mainProfile" class="profile-img" src="https://i.ibb.co/mCZ2x6pK/IMG-3558.jpg" alt="Profile">
        <img id="discordFrameImg" class="discord-frame" src="https://i.ibb.co/nqR30Rcw/IMG-3563.png" alt="Discord Frame">
      </div>

      <h1 class="store-name" id="storeNameText">welcome to bebselris ♡</h1>
      <p class="bio-text" id="storeBioText">welcome to luvselris
ดูรีวิวกันก่อนได้นะคะ ตัวอย่างงานเว็บ งานป้าย คอนแทค</p>

      <div>
        <div class="music-bar" onclick="toggleMusic()">
          <span id="musicText">pause music</span>
        </div>
      </div>
    </div>

    <!-- 4 ไฮไลท์สตอรี่ (ใส่รูปได้อินฟินิตี้) -->
    <div class="highlights-scroll" id="highlightsBar"></div>

    <!-- 4 แท็บเมนู -->
    <div class="tabs-header">
      <button class="tab-btn active" onclick="switchTab('home')">Home</button>
      <button class="tab-btn" onclick="switchTab('review')">Review</button>
      <button class="tab-btn" onclick="switchTab('details')">Details</button>
      <button class="tab-btn" onclick="switchTab('contact')">Contact</button>
    </div>

    <!-- แท็บ 1: Home (ตารางโพสต์ตัวอย่างงาน 3 ช่องแบบ IG) -->
    <div class="tab-content active" id="tab-home">
      <div class="section-card">
        <div class="posts-grid" id="postsGrid">
          <p style="text-align: center; grid-column: span 3; font-size: 12px; color: var(--palette-muted);">กำลังโหลดตัวอย่างงาน...</p>
        </div>
      </div>
    </div>

    <!-- แท็บ 2: Review (รวมรีวิวและไฮไลท์สตอรี่) -->
    <div class="tab-content" id="tab-review">
      <div class="review-list" id="reviewList"></div>
    </div>

    <!-- แท็บ 3: Details (รายละเอียดและคำขอบคุณ) -->
    <div class="tab-content" id="tab-details">
      <div class="details-box">
        <div class="details-text" id="detailsText">welcome to luvselris
ตัวอย่างงานป้าย งานเว็บ และรายละเอียดการสั่งซื้อ</div>
        <div class="thanks-card" id="thanksBoxText">
          thank you for supporting bebselris ♡
        </div>
      </div>
    </div>

    <!-- แท็บ 4: Contact (ช่องทางการติดต่อ 3 ช่องทาง) -->
    <div class="tab-content" id="tab-contact">
      <div class="contact-list" id="contactList"></div>
    </div>

  </div>

  <!-- Modal ดูงานขนาดจริง 100% -->
  <div class="modal-overlay" id="postModal">
    <div class="modal-card">
      <button type="button" class="modal-close" onclick="closeModal()">✕</button>
      <div class="modal-img-wrap">
        <img id="modalImg" src="" alt="Work Preview">
      </div>
      <div class="modal-desc" id="modalDesc">คำอธิบายงาน...</div>
      <a id="modalLink" href="#" target="_blank" class="modal-link-btn">
        เปิดดูลำดับงาน / ลิงก์ชิ้นงาน
      </a>
    </div>
  </div>

  <!-- Story Fullscreen Viewer Modal -->
  <div class="story-modal" id="storyModal">
    <div class="story-bars" id="storyBars"></div>
    <div class="story-header">
      <div class="story-user">
        <span id="storyTitleText">Highlight</span>
      </div>
      <button class="story-close" onclick="closeStory()">✕</button>
    </div>
    <div class="story-body">
      <div class="story-nav-btn story-nav-left" onclick="prevStory()"></div>
      <img id="storyActiveImg" src="" alt="Story Image">
      <div class="story-nav-btn story-nav-right" onclick="nextStory()"></div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCpAGDSy1NRgmLV_g7qJrCpwOhU9MrfQyY",
      authDomain: "benefitie.firebaseapp.com",
      projectId: "benefitie",
      storageBucket: "benefitie.firebasestorage.app",
      messagingSenderId: "270365672215",
      appId: "1:270365672215:web:230d1491091e26ce83ed52"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentHighlights = [];
    let activeHighlightIdx = 0;
    let activeStoryImgIdx = 0;
    let storyTimer = null;

    // ลูกเล่นเฉพาะที่สั่ง: ♡ 🍮 🪽 ☁️ และรูป PNG
    const allowedEmojis = ['♡', '🍮', '🪽', '☁️'];
    let customFloatPng = 'https://i.ibb.co/tTxJ3Ykc/IMG-3650.png';

    // ดึงข้อมูล Realtime จาก bebselris_pure_pink
    db.collection("bebselris_pure_pink").doc("config").onSnapshot(doc => {
      if (doc.exists) {
        const d = doc.data();
        if (d.siteTitle) document.getElementById('pageTitle').textContent = d.siteTitle;
        if (d.storeName) document.getElementById('storeNameText').textContent = d.storeName;
        if (d.storeBio) document.getElementById('storeBioText').textContent = d.storeBio;
        if (d.bannerImg) document.getElementById('mainBanner').src = d.bannerImg;
        if (d.profileImg) document.getElementById('mainProfile').src = d.profileImg;
        if (d.discordFrame) document.getElementById('discordFrameImg').src = d.discordFrame;

        if (d.details) document.getElementById('detailsText').textContent = d.details;
        if (d.thanksText) document.getElementById('thanksBoxText').textContent = d.thanksText;

        if (d.floatPng) customFloatPng = d.floatPng;

        if (d.contacts && Array.isArray(d.contacts)) {
          renderContacts(d.contacts);
        }

        if (d.highlights && Array.isArray(d.highlights)) {
          currentHighlights = d.highlights;
          renderHighlights(d.highlights);
          renderReviewList(d.highlights);
        }

        if (d.musicUrl) {
          const m = document.getElementById('bgMusic');
          if (m && m.src !== d.musicUrl) {
            m.src = d.musicUrl;
            m.play().catch(() => {});
          }
        }
      }
    });

    // ดึงโพสต์งาน 3 ช่องแบบ IG จาก bebselris_pure_posts
    db.collection("bebselris_pure_posts").orderBy("createdAt", "desc").onSnapshot(snapshot => {
      const grid = document.getElementById('postsGrid');
      grid.innerHTML = '';
      if (snapshot.empty) {
        grid.innerHTML = '<p style="text-align:center; grid-column:span 3; font-size:12px; color:var(--palette-muted);">ยังไม่มีตัวอย่างงานค่ะ</p>';
        return;
      }
      snapshot.forEach(doc => {
        const item = { id: doc.id, ...doc.data() };
        const slot = document.createElement('div');
        slot.className = 'post-slot';
        slot.onclick = () => openPostModal(item);
        slot.innerHTML = `<img src="${item.imageUrl || ''}" alt="Post">`;
        grid.appendChild(slot);
      });
    });

    // Auto-play เพลงทันทีเมื่อเข้าเว็บ (ไม่มี Gate)
    const music = document.getElementById('bgMusic');
    const musicText = document.getElementById('musicText');

    function startMusicImmediately() {
      music.play().then(() => {
        musicText.textContent = "pause music";
      }).catch(() => {
        musicText.textContent = "play music";
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      startMusicImmediately();
      ['click', 'touchstart'].forEach(evt => {
        document.body.addEventListener(evt, () => {
          if (music.paused) {
            music.play().then(() => { musicText.textContent = "pause music"; }).catch(() => {});
          }
        }, { once: true });
      });
    });

    function toggleMusic() {
      if (music.paused) {
        music.play();
        musicText.textContent = "pause music";
      } else {
        music.pause();
        musicText.textContent = "play music";
      }
    }

    function renderHighlights(hl) {
      const bar = document.getElementById('highlightsBar');
      bar.innerHTML = '';
      hl.forEach((item, idx) => {
        const cover = item.cover || (item.images && item.images[0]) || "https://i.ibb.co/mCZ2x6pK/IMG-3558.jpg";
        const div = document.createElement('div');
        div.className = 'highlight-item';
        div.onclick = () => openStory(idx);
        div.innerHTML = `
          <div class="highlight-ring"><img class="highlight-thumb" src="${cover}"></div>
          <div class="highlight-name">${item.title || 'Review'}</div>
        `;
        bar.appendChild(div);
      });
    }

    function renderReviewList(hl) {
      const list = document.getElementById('reviewList');
      list.innerHTML = '';
      hl.forEach((item, idx) => {
        const cover = item.cover || (item.images && item.images[0]) || "https://i.ibb.co/mCZ2x6pK/IMG-3558.jpg";
        const count = item.images ? item.images.length : 0;
        const div = document.createElement('div');
        div.className = 'review-card-item';
        div.onclick = () => openStory(idx);
        div.innerHTML = `
          <img src="${cover}">
          <div class="review-info">
            <div class="review-info-title">${item.title || 'Review'}</div>
            <div class="review-info-sub">รวม ${count} รูปภาพ (แตะเพื่อเปิดดูแบบเต็มจอ)</div>
          </div>
          <span style="color: var(--palette-main); font-weight:700;">➔</span>
        `;
        list.appendChild(div);
      });
    }

    function renderContacts(contacts) {
      const box = document.getElementById('contactList');
      box.innerHTML = '';
      contacts.forEach(c => {
        if (!c.url) return;
        const a = document.createElement('a');
        a.href = c.url;
        a.target = '_blank';
        a.className = 'contact-link-item';
        a.innerHTML = `<span>${c.title}</span> <span style="color:var(--palette-main);">➔</span>`;
        box.appendChild(a);
      });
    }

    function openStory(idx) {
      activeHighlightIdx = idx;
      activeStoryImgIdx = 0;
      const hl = currentHighlights[idx];
      if (!hl || !hl.images || !hl.images.length) {
        alert("ไฮไลท์นี้ยังไม่มีรูปภาพค่ะ");
        return;
      }
      document.getElementById("storyTitleText").textContent = hl.title || 'Highlight';
      buildStoryBars();
      showStoryImage();
      document.getElementById("storyModal").classList.add("show");
    }

    function buildStoryBars() {
      const hl = currentHighlights[activeHighlightIdx];
      const bars = document.getElementById("storyBars");
      bars.innerHTML = "";
      hl.images.forEach((_, i) => {
        const bar = document.createElement("div");
        bar.className = "story-bar";
        bar.innerHTML = `<div class="story-bar-fill" id="sbar-${i}"></div>`;
        bars.appendChild(bar);
      });
    }

    function showStoryImage() {
      clearTimeout(storyTimer);
      const hl = currentHighlights[activeHighlightIdx];
      const img = hl.images[activeStoryImgIdx];
      document.getElementById("storyActiveImg").src = img;

      hl.images.forEach((_, i) => {
        const fill = document.getElementById(`sbar-${i}`);
        if (!fill) return;
        if (i < activeStoryImgIdx) {
          fill.style.width = "100%";
        } else if (i === activeStoryImgIdx) {
          fill.style.width = "0%";
          setTimeout(() => { fill.style.width = "100%"; }, 50);
        } else {
          fill.style.width = "0%";
        }
      });

      storyTimer = setTimeout(() => { nextStory(); }, 5000);
    }

    function nextStory() {
      const hl = currentHighlights[activeHighlightIdx];
      if (activeStoryImgIdx < hl.images.length - 1) {
        activeStoryImgIdx++;
        showStoryImage();
      } else {
        closeStory();
      }
    }

    function prevStory() {
      if (activeStoryImgIdx > 0) {
        activeStoryImgIdx--;
        showStoryImage();
      }
    }

    function closeStory() {
      clearTimeout(storyTimer);
      document.getElementById("storyModal").classList.remove("show");
    }

    function openPostModal(post) {
      document.getElementById('modalImg').src = post.imageUrl || '';
      document.getElementById('modalDesc').textContent = post.description || 'ไม่มีคำอธิบายเพิ่มเติมค่ะ ♡';
      const linkBtn = document.getElementById('modalLink');
      if (post.workUrl && post.workUrl.trim() !== '') {
        linkBtn.href = post.workUrl;
        linkBtn.style.display = 'flex';
      } else {
        linkBtn.style.display = 'none';
      }
      document.getElementById('postModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('postModal').classList.remove('active');
    }

    function switchTab(tabId) {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
      event.currentTarget.classList.add("active");
      document.getElementById(`tab-${tabId}`).classList.add("active");
    }

    // เลเยอร์ลอย: สลับสุ่มระหว่าง ♡ 🍮 🪽 ☁️ และรูป PNG
    const floatBox = document.getElementById('floatingContainer');
    function createFloatingAsset() {
      const isPng = Math.random() > 0.5;
      const el = document.createElement(isPng ? 'img' : 'div');
      el.className = 'float-item ' + (isPng ? 'float-png' : 'float-emoji');
      if (isPng) {
        el.src = customFloatPng;
      } else {
        el.textContent = allowedEmojis[Math.floor(Math.random() * allowedEmojis.length)];
      }
      el.style.left = Math.random() * 90 + 'vw';
      el.style.animationDuration = (8 + Math.random() * 5) + 's';
      floatBox.appendChild(el);
      setTimeout(() => { el.remove(); }, 14000);
    }
    setInterval(createFloatingAsset, 1400);
  </script>
</body>
</html>
