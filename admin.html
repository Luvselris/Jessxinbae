<html lang="th">
<head>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>

  <style>
    :root {
      --bg-pink: #fff5f8;
      --card-bg: #ffffff;
      --border-pink: #fde2ec;
      --pink-main: #f08ea8;
      --pink-deep: #db7b97;
      --text-dark: #4a3e42;
      --text-muted: #8c7780;
      --danger: #ef4444;
      --pink-glow: rgba(240, 142, 168, 0.2);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', 'Mitr', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: radial-gradient(circle at top, #ffffff 0%, var(--bg-pink) 60%, #fae6ed 100%);
      color: var(--text-dark);
      min-height: 100vh;
      padding: 20px 14px 80px;
      display: flex;
      justify-content: center;
    }
    .container { width: 100%; max-width: 460px; }f
    
    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 20px 16px;
      box-shadow: 0 10px 25px var(--pink-glow);
      border: 1.5px solid var(--border-pink);
      margin-bottom: 16px;
    }
    .title {
      font-size: 17px;
      font-weight: 700;
      color: var(--pink-main);
      text-align: center;
      margin-bottom: 16px;
    }
    .field-group { margin-bottom: 14px; }
    .field-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 6px;
      display: block;
    }
    .input-box, .textarea-box {
      width: 100%;
      padding: 11px 14px;
      border-radius: 14px;
      border: 1.5px solid var(--border-pink);
      outline: none;
      font-size: 13.5px;
      background: #fff;
      color: var(--text-dark);
      transition: border-color 0.2s;
    }
    .input-box:focus, .textarea-box:focus { border-color: var(--pink-main); }
    .textarea-box { resize: vertical; min-height: 75px; line-height: 1.5; }

    .file-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 14px;
      background: #fff3f6;
      border: 1.5px dashed var(--pink-main);
      border-radius: 14px;
      color: var(--pink-deep);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-bottom: 6px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 18px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, #f59eb5, var(--pink-main));
      color: #fff;
      margin-top: 6px;
      box-shadow: 0 6px 16px rgba(240, 142, 168, 0.35);
      transition: opacity 0.2s;
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-secondary {
      background: #fff;
      color: var(--pink-deep);
      border: 1.5px solid var(--border-pink);
      margin-top: 10px;
      box-shadow: none;
    }

    /* Highlight Editor */
    .hl-edit-box {
      background: #fffbfa;
      border: 1.5px solid var(--border-pink);
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .hl-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .hl-tag { font-size: 13px; font-weight: 700; color: var(--pink-main); }
    .hl-delete-btn {
      background: #fee2e2;
      color: var(--danger);
      border: 1px solid #fca5a5;
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .hl-gallery {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 8px;
    }
    .hl-img-wrap {
      position: relative;
      aspect-ratio: 1/1;
      border-radius: 8px;
      overflow: hidden;
      background: #fde2ec;
    }
    .hl-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .hl-img-del {
      position: absolute;
      top: 2px;
      right: 2px;
      background: rgba(239, 68, 68, 0.85);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

      padding: 12px;
      margin-bottom: 8px;
      display: flex;

      align-items: center;
      gap: 10px;
    }

    .hidden { display: none !important; }
  </style>
</head>

  // ฟังก์ชันย่อขนาดภาพเพื่อไม่ให้เกินขีดจำกัดเอกสารของ Firestore
  function compressImg(file, maxDimension = 650, quality = 0.75) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          let w = img.width, h = img.height;
          if (w > maxDimension || h > maxDimension) {
            if (w > h) { h = Math.round((h * maxDimension) / w); w = maxDimension; }
            else { w = Math.round((w * maxDimension) / h); h = maxDimension; }
          }
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function uploadDirect(event, targetId) {
    const file = event.target.files[0];
    if (!file) return;
    try {
      const b64 = await compressImg(file, 1200, 0.92);
      document.getElementById(targetId).value = b64;
    } catch (e) {
      alert("แปลงรูปไม่ผ่าน");
    }
  }

      document.getElementById("cUrl3").value = c[2] ? c[2].url : "https://www.instagram.com/jesselvucat_?stkn=MW1xbGFrYWF5MDdxag%3D%3D&utm_source=qr";

      document.getElementById("musicUrl").value = d.musicUrl || "https://file.garden/asG8Gt-rqWIpi3II/YENTED%20-%20%E0%B8%AB%E0%B8%B4%E0%B8%99%E0%B8%AB%E0%B8%A2%E0%B8%94%E0%B8%A5%E0%B8%87%E0%B8%99%E0%B9%89%E0%B8%B3%20(adore)%20ft.%20Minchang%2C%20gomen.%20%5BOfficial%20Video%5D.mp3";

  function renderHlManager() {
    const box = document.getElementById("highlightsManager");
    box.innerHTML = "";
    highlightsData.forEach((hl, idx) => {
      const wrap = document.createElement("div");
      wrap.className = "hl-edit-box";
      wrap.innerHTML = `
        <div class="hl-header-bar">
          <span class="hl-tag">ไฮไลท์ที่ ${idx+1}</span>
          <button type="button" class="hl-delete-btn" onclick="deleteHl(${idx})">ลบ</button>
        </div>
        <div class="field-group">
          <label class="field-label">ชื่อข้อความใต้ไฮไลท์</label>
          <input type="text" class="input-box" value="${hl.title || ''}" oninput="highlightsData[${idx}].title = this.value">
        </div>
        <div class="field-group">
          <label class="field-label">รูปหน้าปกไฮไลท์ (URL)</label>
          <input type="text" class="input-box" value="${hl.cover || ''}" placeholder="URL หน้าปก" oninput="highlightsData[${idx}].cover = this.value">
        </div>
        <label class="file-btn">
          ➕ อัปโหลดรูปเพิ่มเข้าสตอรี่นี้ (จากโทรศัพท์)
          <input type="file" accept="image/*" multiple style="display:none;" onchange="uploadStoryImages(event, ${idx})">
        </label>
        <div style="font-size:12px; color:var(--text-muted); margin-top:4px;">มี ${hl.images ? hl.images.length : 0} ภาพ (ใส่ได้ไม่จำกัด)</div>
        <div class="hl-gallery" id="hl-gal-${idx}"></div>
      `;
      box.appendChild(wrap);

      const gal = wrap.querySelector(`#hl-gal-${idx}`);
      if (hl.images) {
        hl.images.forEach((imgUrl, imgIdx) => {
          const item = document.createElement("div");
          item.className = "hl-img-wrap";
          item.innerHTML = `
            <img src="${imgUrl}">
            <button type="button" class="hl-img-del" onclick="removeStoryImg(${idx}, ${imgIdx})">×</button>

          gal.appendChild(item);
        });

  function deleteHl(idx) {

  async function uploadStoryImages(event, hlIdx) {
    const files = Array.from(event.target.files);
    if (!files.length) return;
    if (!highlightsData[hlIdx].images) highlightsData[hlIdx].images = [];
    
    for (const f of files) {
      try {
        const b64 = await compressImg(f, 1200, 0.92);
        highlightsData[hlIdx].images.push(b64);
      } catch (err) {}
    }
    renderHlManager();
  }

  function removeStoryImg(hlIdx, imgIdx) {
    highlightsData[hlIdx].images.splice(imgIdx, 1);
    renderHlManager();
  }

  function listenReviews() {
    db.collection("babyselris_exact_reviews").orderBy("createdAt", "desc").onSnapshot(snap => {
      const box = document.getElementById("reviewsListAdmin");
      box.innerHTML = "";
      if (snap.empty) {
        box.innerHTML = '<p style="font-size:12px; color:var(--text-muted);">ยังไม่มีรีวิวส่งเข้ามา</p>';
        return;
      }
      snap.forEach(doc => {
        const d = doc.data();
        const div = document.createElement("div");
        div.className = "review-del-item";
        div.innerHTML = `
          <div>
            <div style="font-weight:700; font-size:13px;">${d.name} (${'★'.repeat(d.stars || 5)})</div>
            <div style="font-size:12px; color:var(--text-muted);">${d.msg}</div>
          </div>
          <button type="button" class="hl-delete-btn" onclick="delReview('${doc.id}')">ลบ</button>
        `;
        box.appendChild(div);
      });
    });
  }

  async function delReview(id) {
    if (confirm("ต้องการลบรีวิวนี้ใช่ไหมคะ?")) {
      await db.collection("babyselris_exact_reviews").doc(id).delete();
    }
  }

  async function saveAll() {
    const btn = document.getElementById("saveBtn");
    btn.disabled = true;
    btn.textContent = "กำลังบันทึกข้อมูล...";

    const payload = {
      siteTitle: document.getElementById("siteTitle").value.trim(),
      storeName: document.getElementById("storeName").value.trim(),
      storeBio: document.getElementById("storeBio").value.trim(),
      bannerImg: document.getElementById("bannerImg").value.trim(),
      profileImg: document.getElementById("profileImg").value.trim(),

      highlights: highlightsData,

      details: document.getElementById("detailsContent").value.trim(),
      thanksText: document.getElementById("thanksText").value.trim(),

      contacts: [
        { title: document.getElementById("cTitle1").value.trim(), sub: document.getElementById("cSub1").value.trim(), url: document.getElementById("cUrl1").value.trim(), icon: "💬" },
        { title: document.getElementById("cTitle2").value.trim(), sub: document.getElementById("cSub2").value.trim(), url: document.getElementById("cUrl2").value.trim(), icon: "💌" },
        { title: document.getElementById("cTitle3").value.trim(), sub: document.getElementById("cSub3").value.trim(), url: document.getElementById("cUrl3").value.trim(), icon: "🌸" }
      ],

      musicUrl: document.getElementById("musicUrl").value.trim(),
      floatPng: document.getElementById("floatPng").value.trim(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };

    const newPass = document.getElementById("newAdminPassword").value.trim();
    if (newPass) {
      payload.adminPass = newPass;
      currentAdminPass = newPass;
    }

    try {
      await db.collection("babyselris_exact_site").doc("config").set(payload, { merge: true });
      alert("บันทึกข้อมูลสำเร็จแล้วค่ะ หน้าเว็บจะอัปเดตทันที ♡");
      document.getElementById("newAdminPassword").value = "";
    } catch (e) {
      alert("เกิดข้อผิดพลาดในการบันทึก: " + e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = "บันทึกขึ้นระบบทันที ♡";
    }
  }

  function logout() {
    document.getElementById("dashboardBox").classList.add("hidden");
    document.getElementById("loginBox").classList.remove("hidden");
  }
</script>
</body>
</html>
